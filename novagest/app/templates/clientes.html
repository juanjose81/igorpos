<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Igorpos - Clientes</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: white; }
        input, button { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; margin-right: 10px; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
<div class="header">
    <h2 style="color: #38bdf8; margin: 0;">👥 Igorpos - Gestión de Clientes</h2>
    <div>
        <a href="/" style="color: #f8fafc; text-decoration: none; margin-right: 15px;">🏠 Inicio</a>
        <a href="/mesas" style="color: #f8fafc; text-decoration: none; margin-right: 15px;">🍽️ Mesas</a>
        <a href="/reportes" style="color: #f8fafc; text-decoration: none; margin-right: 15px;">📊 Reportes</a>
        <a href="/configuracion" style="color: #f8fafc; text-decoration: none;">⚙️ Configuración</a>
    </div>
</div>

<div class="card">
    <h3>Registrar Nuevo Cliente</h3>
    <form action="/clientes/agregar" method="POST" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="text" name="telefono" placeholder="Teléfono" required>
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <button type="submit">Guardar Cliente</button>
    </form>
</div>

<div class="card">
    <h3>Lista de Clientes</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
            </tr>
        </thead>
        <tbody>
            {% for c in clientes %}
            <tr>
                <td>{{ c[0] }}</td>
                <td>{{ c[1] }}</td>
                <td>{{ c[2] }}</td>
                <td>{{ c[3] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center; color: #64748b;">No hay clientes registrados aún.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
