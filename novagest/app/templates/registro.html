<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - IGOR POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 420px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card h2 { color: #38bdf8; margin-bottom: 8px; text-align: center; }
        .card p { color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 12px; background-color: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-submit:hover { background-color: #38bdf8; color: #0f172a; }
        .free-badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 6px 12px; border-radius: 20px; text-align: center; font-size: 0.8rem; font-weight: bold; margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.3); }
        .login-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
        .login-link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>IGOR POS</h2>
        <div class="free-badge">🎁 7 DÍAS DE PRUEBA TOTALMENTE GRATIS</div>
        <p>Crea tu cuenta de Gerente y empieza a controlar tu negocio</p>
        <form action="/registro" method="POST">
            <div class="form-group">
                <label>Nombre del Restaurante / Negocio</label>
                <input type="text" name="nombre_restaurante" required placeholder="Ej: Mi Restaurante POS">
            </div>
            <div class="form-group">
                <label>Correo Electrónico (Gmail)</label>
                <input type="email" name="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Teléfono / WhatsApp</label>
                <input type="tel" name="telefono" required placeholder="Ej: 3213860752">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Comenzar Prueba Gratis 🚀</button>
        </form>
        <div class="login-link">
            ¿Ya tienes una cuenta? <a href="/login">Inicia Sesión</a>
        </div>
    </div>
</body>
</html>
