<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Producto - Nova Gest</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #161b22; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #58a6ff; }
        label { display: block; margin-top: 10px; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; }
        button { width: 100%; background: #238636; color: white; padding: 10px; border: none; border-radius: 5px; margin-top: 20px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Crear Nuevo Producto</h2>
        <form method="POST">
            <label>Nombre del Producto:</label>
            <input type="text" name="nombre" required placeholder="Ej: Hamburguesa Especial">

            <label>Precio:</label>
            <input type="number" step="0.01" name="precio" required placeholder="Ej: 15000">

            <label>Categoría:</label>
            <input type="text" name="categoria" placeholder="Ej: Comidas Rápidas">

            <label>Descripción:</label>
            <textarea name="descripcion" placeholder="Detalles del producto..."></textarea>

            <button type="submit">Guardar Producto</button>
        </form>
    </div>
</body>
</html>
